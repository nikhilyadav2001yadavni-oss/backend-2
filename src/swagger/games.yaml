paths:
  /api/v1/games/bet/color-changer:
    post:
      tags:
        - Games
      summary: Place bet for Color Changer game
      description: |
        Place a bet on the Color Changer game. User selects a color (RED, GREEN, or BLUE) and bets an amount (1-25).
        The game uses a three-tier decision logic to determine win/loss:
        1. User profit/loss limits (max $25 profit, max $25 loss)
        2. Platform risk check (ensures platform has sufficient balance)
        3. Normal gameplay with controlled probability (40% win chance)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - color
                - betAmount
              properties:
                color:
                  type: string
                  enum: [RED, GREEN, BLUE]
                  example: RED
                  description: Color selected by user
                betAmount:
                  type: number
                  minimum: 1
                  maximum: 25
                  example: 10
                  description: Bet amount (must be integer between 1 and 25)
      responses:
        '200':
          description: Bet placed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Congratulations! You won 20 USDT!
                  data:
                    type: object
                    properties:
                      gameId:
                        type: string
                        example: GAME20241228143025457
                        description: Unique game ID
                      result:
                        type: string
                        enum: [WIN, LOSE]
                        example: WIN
                        description: Game result
                      userColor:
                        type: string
                        enum: [RED, GREEN, BLUE]
                        example: RED
                        description: Color selected by user
                      winningColor:
                        type: string
                        enum: [RED, GREEN, BLUE]
                        example: GREEN
                        description: Winning color (for display)
                      betAmount:
                        type: number
                        example: 10
                        description: Amount bet
                      winAmount:
                        type: number
                        example: 20
                        description: Amount won (if result is WIN)
                      lossAmount:
                        type: number
                        example: 10
                        description: Amount lost (if result is LOSE)
                      userProfitLoss:
                        type: number
                        example: 15
                        description: User's total profit/loss after this game
                      gamingWalletBalance:
                        type: number
                        example: 500
                        description: Updated gaming wallet balance
              examples:
                win:
                  value:
                    success: true
                    message: Congratulations! You won 20 USDT!
                    data:
                      gameId: GAME20241228143025457
                      result: WIN
                      userColor: RED
                      winningColor: GREEN
                      betAmount: 10
                      winAmount: 20
                      userProfitLoss: 15
                      gamingWalletBalance: 510
                lose:
                  value:
                    success: true
                    message: Sorry, you lost 10 USDT. Better luck next time!
                    data:
                      gameId: GAME20241228143025458
                      result: LOSE
                      userColor: BLUE
                      winningColor: RED
                      betAmount: 10
                      lossAmount: 10
                      userProfitLoss: -5
                      gamingWalletBalance: 490
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidColor:
                  value:
                    success: false
                    message: Color must be RED, GREEN, or BLUE
                    data: null
                invalidBetAmount:
                  value:
                    success: false
                    message: Bet amount must be an integer between 1 and 25
                    data: null
                insufficientBalance:
                  value:
                    success: false
                    message: Insufficient balance in gaming wallet
                    data: null
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Authentication required
                data: null
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/games/bet/dice-roll:
    post:
      tags:
        - Games
      summary: Place bet for Dice Roll game
      description: |
        Place a bet on the Dice Roll game. User can bet on:
        - Single Numbers: Select a single number (1-6)
        - Number Range: Select a range on the die face (1–6); the range may include 1, 2, or 3 numbers (e.g. 2–2, 2–3, 1–3), never more than three
        Bet amount must be between 1-25.
        The game uses a three-tier decision logic to determine win/loss:
        1. User profit/loss limits (max $25 profit, max $25 loss)
        2. Platform risk check (ensures platform has sufficient balance)
        3. Normal gameplay with controlled probability (40% win chance)
        If dice result matches the bet AND system allows win, user wins 2x bet amount.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - betType
                - betAmount
              properties:
                betType:
                  type: string
                  enum: [SINGLE_NUMBERS, NUMBER_RANGE]
                  example: SINGLE_NUMBERS
                  description: Type of bet - single numbers or number range
                betAmount:
                  type: number
                  minimum: 1
                  maximum: 25
                  example: 10
                  description: Bet amount (must be integer between 1 and 25)
                selectedNumber:
                  type: number
                  minimum: 1
                  maximum: 6
                  example: 3
                  description: Single number (1-6) for single numbers bet. Required if betType is SINGLE_NUMBERS
                selectedRange:
                  type: object
                  properties:
                    from:
                      type: number
                      minimum: 1
                      maximum: 6
                      example: 2
                      description: Start of inclusive range (1-6)
                    to:
                      type: number
                      minimum: 1
                      maximum: 6
                      example: 3
                      description: End of inclusive range (1-6, must be >= from); at most 3 numbers total (`to - from` <= 2)
                  example:
                    from: 2
                    to: 3
                  description: Inclusive range of 1 to 3 consecutive integers (from through to). Required if betType is NUMBER_RANGE
      responses:
        '200':
          description: Bet placed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Congratulations! Dice rolled 3. You won 20 USDT (2.0x)!
                  data:
                    type: object
                    properties:
                      gameId:
                        type: string
                        example: GAME20241228143025457
                        description: Unique game ID
                      result:
                        type: string
                        enum: [WIN, LOSE]
                        example: WIN
                        description: Game result
                      betType:
                        type: string
                        enum: [SINGLE_NUMBERS, NUMBER_RANGE]
                        example: SINGLE_NUMBERS
                        description: Type of bet placed
                      selectedNumber:
                        type: number
                        minimum: 1
                        maximum: 6
                        example: 3
                        description: Selected number (if betType is SINGLE_NUMBERS)
                      selectedRange:
                        type: object
                        properties:
                          from:
                            type: number
                            example: 2
                          to:
                            type: number
                            example: 4
                        description: Selected inclusive range, at most 3 numbers (if betType is NUMBER_RANGE)
                      diceResult:
                        type: number
                        minimum: 1
                        maximum: 6
                        example: 3
                        description: The actual dice result (1-6)
                      betAmount:
                        type: number
                        example: 10
                        description: Amount bet
                      winAmount:
                        type: number
                        example: 20
                        description: Amount won (if result is WIN)
                      lossAmount:
                        type: number
                        example: 10
                        description: Amount lost (if result is LOSE)
                      userProfitLoss:
                        type: number
                        example: 15
                        description: User's total profit/loss after this game
                      gamingWalletBalance:
                        type: number
                        example: 500
                        description: Updated gaming wallet balance
              examples:
                winSingleNumbers:
                  value:
                    success: true
                    message: 'Congratulations! Dice rolled 3. You won 20 USDT (2.0x)!'
                    data:
                      gameId: GAME20241228143025457
                      result: WIN
                      betType: SINGLE_NUMBERS
                      selectedNumber: 3
                      diceResult: 3
                      betAmount: 10
                      winAmount: 20
                      userProfitLoss: 15
                      gamingWalletBalance: 510
                winNumberRange:
                  value:
                    success: true
                    message: 'Congratulations! Dice rolled 4. You won 20 USDT (2.0x)!'
                    data:
                      gameId: GAME20241228143025458
                      result: WIN
                      betType: NUMBER_RANGE
                      selectedRange:
                        from: 2
                        to: 4
                      diceResult: 4
                      betAmount: 10
                      winAmount: 20
                      userProfitLoss: 10
                      gamingWalletBalance: 520
                lose:
                  value:
                    success: true
                    message: 'Sorry, dice rolled 1. You lost 10 USDT. Better luck next time!'
                    data:
                      gameId: GAME20241228143025459
                      result: LOSE
                      betType: SINGLE_NUMBERS
                      selectedNumber: 3
                      diceResult: 1
                      betAmount: 10
                      lossAmount: 10
                      userProfitLoss: -5
                      gamingWalletBalance: 490
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBetType:
                  value:
                    success: false
                    message: Bet type must be SINGLE_NUMBERS or NUMBER_RANGE
                    data: null
                missingSelectedNumber:
                  value:
                    success: false
                    message: Selected number is required for single numbers bet
                    data: null
                invalidSelectedNumber:
                  value:
                    success: false
                    message: Selected number must be an integer between 1 and 6
                    data: null
                missingSelectedRange:
                  value:
                    success: false
                    message: Selected range is required for number range bet
                    data: null
                invalidRange:
                  value:
                    success: false
                    message: Range values must be integers between 1 and 6
                    data: null
                invalidBetAmount:
                  value:
                    success: false
                    message: Bet amount must be an integer between 1 and 25
                    data: null
                insufficientBalance:
                  value:
                    success: false
                    message: Insufficient balance in gaming wallet
                    data: null
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Authentication required
                data: null
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/games/bet/dragon-tiger:
    post:
      tags:
        - Games
      summary: Place bet for Dragon Tiger game
      description: |
        Place a bet on the Dragon Tiger game. User can bet on DRAGON, TIGER, or TIE.
        Two cards are dealt - one for Dragon and one for Tiger. Higher card value wins.
        - Dragon/Tiger bets: 1:1 payout (2x multiplier - bet $10, win $20)
        - Tie bets: 11:1 payout (12x multiplier - bet $10, win $120)
        Bet amount must be between 1-25.
        The game uses a three-tier decision logic to determine win/loss:
        1. User profit/loss limits (max $25 profit, max $25 loss)
        2. Platform risk check (ensures platform has sufficient balance)
        3. Normal gameplay with controlled probability (40% win chance)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - betType
                - betAmount
              properties:
                betType:
                  type: string
                  enum: [DRAGON, TIGER, TIE]
                  example: DRAGON
                  description: Bet type - DRAGON, TIGER, or TIE
                betAmount:
                  type: number
                  minimum: 1
                  maximum: 25
                  example: 10
                  description: Bet amount (must be integer between 1 and 25)
      responses:
        '200':
          description: Bet placed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Congratulations! DRAGON won. You won 20 USDT (2.0x)!
                  data:
                    type: object
                    properties:
                      gameId:
                        type: string
                        example: GAME20241228143025457
                        description: Unique game ID
                      result:
                        type: string
                        enum: [WIN, LOSE]
                        example: WIN
                        description: Game result
                      betType:
                        type: string
                        enum: [DRAGON, TIGER, TIE]
                        example: DRAGON
                        description: Type of bet placed
                      dragonCard:
                        type: object
                        properties:
                          suit:
                            type: string
                            example: Hearts
                            description: Card suit
                          rank:
                            type: string
                            example: King
                            description: Card rank
                          value:
                            type: number
                            example: 13
                            description: Card value (Ace=1, 2-10=face value, Jack=11, Queen=12, King=13)
                        description: Card dealt for Dragon
                      tigerCard:
                        type: object
                        properties:
                          suit:
                            type: string
                            example: Spades
                          rank:
                            type: string
                            example: 7
                          value:
                            type: number
                            example: 7
                        description: Card dealt for Tiger
                      winningSide:
                        type: string
                        enum: [DRAGON, TIGER, TIE]
                        example: DRAGON
                        description: The winning side
                      betAmount:
                        type: number
                        example: 10
                        description: Amount bet
                      winAmount:
                        type: number
                        example: 20
                        description: Amount won (if result is WIN)
                      lossAmount:
                        type: number
                        example: 10
                        description: Amount lost (if result is LOSE)
                      userProfitLoss:
                        type: number
                        example: 15
                        description: User's total profit/loss after this game
                      gamingWalletBalance:
                        type: number
                        example: 500
                        description: Updated gaming wallet balance
              examples:
                winDragon:
                  value:
                    success: true
                    message: 'Congratulations! DRAGON won. You won 20 USDT (2.0x)!'
                    data:
                      gameId: GAME20241228143025457
                      result: WIN
                      betType: DRAGON
                      dragonCard:
                        suit: Hearts
                        rank: King
                        value: 13
                      tigerCard:
                        suit: Spades
                        rank: 7
                        value: 7
                      winningSide: DRAGON
                      betAmount: 10
                      winAmount: 20
                      userProfitLoss: 15
                      gamingWalletBalance: 510
                winTie:
                  value:
                    success: true
                    message: 'Congratulations! TIE won. You won 120 USDT (12.0x)!'
                    data:
                      gameId: GAME20241228143025458
                      result: WIN
                      betType: TIE
                      dragonCard:
                        suit: Hearts
