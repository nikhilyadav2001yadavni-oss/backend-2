  /api/v1/games/gameTransactions:
    get:
      tags:
        - Games
      summary: Get game transactions
      description: |
        Retrieve paginated list of game transactions (GAME_WIN and GAME_LOSE) for the authenticated user.
        Returns all game-related transactions including wins and losses from Color Changer, Dice Roll, Dragon Tiger, Super Over, and Marble Race games.
        Can be filtered by game name (COLOR_CHANGER, DICE_ROLL, DRAGON_TIGER, SUPER_OVER, or MARBLE_RACE) and game type (ALL, WIN, or LOSS).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (starts at 1)
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of transactions per page (max 100)
          example: 20
        - in: query
          name: gameName
          schema:
            type: string
            enum: [COLOR_CHANGER, DICE_ROLL, DRAGON_TIGER, SUPER_OVER, MARBLE_RACE]
          required: false
          description: Filter by game name (optional)
          example: COLOR_CHANGER
        - in: query
          name: gameType
          schema:
            type: string
            enum: [ALL, WIN, LOSS]
            default: ALL
          required: false
          description: Filter by game type - ALL (both wins and losses), WIN (only wins), or LOSS (only losses)
          example: ALL
      responses:
        '200':
          description: Game transactions fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Game transactions fetched successfully
                  data:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Transaction'
                            - type: object
                              properties:
                                gameType:
                                  type: string
                                  nullable: true
                                  enum: [COLOR_CHANGER, DICE_ROLL, DRAGON_TIGER, SUPER_OVER, MARBLE_RACE, null]
                                  description: Type of game (COLOR_CHANGER, DICE_ROLL, DRAGON_TIGER, SUPER_OVER, or MARBLE_RACE, null if game not found)
                                  example: COLOR_CHANGER
                                userColor:
                                  type: string
                                  nullable: true
                                  enum: [RED, GREEN, BLUE, null]
                                  description: User's selected color in Color Changer game (null for Dice Roll or if game not found)
                                  example: RED
                                winningColor:
                                  type: string
                                  nullable: true
                                  enum: [RED, GREEN, BLUE, null]
                                  description: The actual result color in Color Changer game (null for Dice Roll or if game not found)
                                  example: GREEN
                                result:
                                  type: string
                                  nullable: true
                                  enum: [WIN, LOSE, null]
                                  description: Game result (WIN or LOSE, null if game not found)
                                  example: WIN
                                betType:
                                  type: string
                                  nullable: true
                                  enum: [SINGLE_NUMBERS, NUMBER_RANGE, null]
                                  description: Dice Roll bet type (SINGLE_NUMBERS or NUMBER_RANGE, null for Color Changer or if game not found)
                                  example: SINGLE_NUMBERS
                                selectedNumber:
                                  type: number
                                  nullable: true
                                  minimum: 1
                                  maximum: 6
                                  description: Selected number for Dice Roll single numbers bet (null for other bet types or if game not found)
                                  example: 3
                                selectedRange:
                                  type: object
                                  nullable: true
                                  properties:
                                    from:
                                      type: number
                                      minimum: 1
                                      maximum: 6
                                      example: 2
                                    to:
                                      type: number
                                      minimum: 1
                                      maximum: 6
                                      example: 4
                                  description: Selected range for Dice Roll (1-3 numbers inclusive; null for other bet types or if game not found)
                                diceResult:
                                  type: number
                                  nullable: true
                                  minimum: 1
                                  maximum: 6
                                  description: The actual dice result (1-6) for Dice Roll game (null for other games or if game not found)
                                  example: 4
                                dragonCard:
                                  type: object
                                  nullable: true
                                  properties:
                                    suit:
                                      type: string
                                      example: Hearts
                                    rank:
                                      type: string
                                      example: King
                                    value:
                                      type: number
                                      example: 13
                                  description: Dragon card for Dragon Tiger game (null for other games or if game not found)
                                tigerCard:
                                  type: object
                                  nullable: true
                                  properties:
                                    suit:
                                      type: string
                                      example: Spades
                                    rank:
                                      type: string
                                      example: 7
                                    value:
                                      type: number
                                      example: 7
                                  description: Tiger card for Dragon Tiger game (null for other games or if game not found)
                                winningSide:
                                  type: string
                                  nullable: true
                                  enum: [DRAGON, TIGER, TIE, null]
                                  description: Winning side for Dragon Tiger game (null for other games or if game not found)
                                  example: DRAGON
                                runThreshold:
                                  type: number
                                  nullable: true
                                  enum: [6, 8, 10, 12, 14, 16, null]
                                  description: Run threshold for Super Over game (null for other games or if game not found)
                                  example: 8
                                ballScores:
                                  type: array
                                  nullable: true
                                  items:
                                    type: number
                                    minimum: 0
                                    maximum: 6
                                  description: Ball scores array for Super Over game (null for other games or if game not found)
                                  example: [4, 0, 2, 6, 0, 0]
                                totalRunsScored:
                                  type: number
                                  nullable: true
                                  description: Total runs scored for Super Over game (null for other games or if game not found)
                                  example: 12
                                selectedMarble:
                                  type: string
                                  nullable: true
                                  enum: [RED, BLUE, GREEN, ORANGE, null]
                                  description: Selected marble for Marble Race game (null for other games or if game not found)
                                  example: RED
                                winningMarble:
                                  type: string
                                  nullable: true
                                  enum: [RED, BLUE, GREEN, ORANGE, null]
                                  description: Winning marble for Marble Race game (null for other games or if game not found)
                                  example: RED
                      totalCount:
