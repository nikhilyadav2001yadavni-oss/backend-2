                      gamingWalletBalance: 620
                lose:
                  value:
                    success: true
                    message: 'Sorry, TIGER won. You lost 10 USDT. Better luck next time!'
                    data:
                      gameId: GAME20241228143025459
                      result: LOSE
                      betType: DRAGON
                      dragonCard:
                        suit: Clubs
                        rank: 5
                        value: 5
                      tigerCard:
                        suit: Diamonds
                        rank: 9
                        value: 9
                      winningSide: TIGER
                      betAmount: 10
                      lossAmount: 10
                      userProfitLoss: -5
                      gamingWalletBalance: 490
