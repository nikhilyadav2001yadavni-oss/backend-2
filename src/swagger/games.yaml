              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/games/bet/super-over:
    post:
      tags:
        - Games
      summary: Place bet for Super Over game
      description: |
        Place a bet on the Super Over cricket game. User predicts if total runs in 6 balls will be OVER or UNDER a threshold.
        - Bet type: OVER or UNDER
        - Run thresholds: 6, 8, 10, 12, 14, or 16 runs
        - Bet amount: Between $10 and $500
        - Payout: 2x multiplier (bet $10, win $20)
        The game simulates 6 balls, each scoring 0-6 runs. Total runs are calculated and compared to the threshold.
        The game uses a three-tier decision logic to determine win/loss:
        1. User profit/loss limits (max $25 profit, max $25 loss)
        2. Platform risk check (ensures platform has sufficient balance)
        3. Normal gameplay with controlled probability (40% win chance)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - betType
                - runThreshold
                - betAmount
              properties:
                betType:
                  type: string
                  enum: [OVER, UNDER]
                  example: OVER
                  description: Bet type - OVER (total runs > threshold) or UNDER (total runs < threshold)
                runThreshold:
                  type: number
                  enum: [6, 8, 10, 12, 14, 16]
                  example: 8
                  description: Run threshold to compare against (6, 8, 10, 12, 14, or 16)
                betAmount:
                  type: number
                  minimum: 10
                  maximum: 500
                  example: 10
                  description: Bet amount (must be integer between 10 and 500)
      responses:
        '200':
          description: Bet placed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Congratulations! Score: 12 runs. You won 20 USDT (2.0x)!'
                  data:
                    type: object
                    properties:
                      gameId:
                        type: string
                        example: GAME20241228143025457
                        description: Unique game ID
                      result:
                        type: string
                        enum: [WIN, LOSE]
                        example: WIN
                        description: Game result
                      betType:
                        type: string
                        enum: [OVER, UNDER]
                        example: OVER
                        description: Type of bet placed
                      runThreshold:
                        type: number
                        enum: [6, 8, 10, 12, 14, 16]
                        example: 8
                        description: Run threshold selected
                      ballScores:
                        type: array
                        items:
                          type: number
                          minimum: 0
                          maximum: 6
                        example: [4, 0, 2, 6, 0, 0]
                        description: Array of 6 ball scores (runs per ball)
                      totalRunsScored:
                        type: number
                        example: 12
                        description: Total runs scored in the over
                      betAmount:
                        type: number
                        example: 10
                        description: Amount bet
                      winAmount:
                        type: number
                        example: 20
                        description: Amount won (if result is WIN)
                      lossAmount:
                        type: number
                        example: 10
                        description: Amount lost (if result is LOSE)
                      userProfitLoss:
                        type: number
                        example: 15
                        description: User's total profit/loss after this game
                      gamingWalletBalance:
                        type: number
                        example: 500
                        description: Updated gaming wallet balance
              examples:
                winOver:
                  value:
                    success: true
                    message: 'Congratulations! Score: 12 runs. You won 20 USDT (2.0x)!'
                    data:
                      gameId: GAME20241228143025457
                      result: WIN
                      betType: OVER
                      runThreshold: 8
                      ballScores: [4, 0, 2, 6, 0, 0]
                      totalRunsScored: 12
                      betAmount: 10
                      winAmount: 20
                      userProfitLoss: 15
                      gamingWalletBalance: 510
                winUnder:
                  value:
                    success: true
                    message: 'Congratulations! Score: 5 runs. You won 20 USDT (2.0x)!'
                    data:
                      gameId: GAME20241228143025458
                      result: WIN
                      betType: UNDER
                      runThreshold: 10
                      ballScores: [1, 0, 2, 1, 1, 0]
                      totalRunsScored: 5
                      betAmount: 10
                      winAmount: 20
                      userProfitLoss: 10
                      gamingWalletBalance: 520
                lose:
                  value:
                    success: true
                    message: 'Sorry, Score: 14 runs. You lost 10 USDT. Better luck next time!'
                    data:
                      gameId: GAME20241228143025459
                      result: LOSE
                      betType: UNDER
                      runThreshold: 10
                      ballScores: [1, 6, 1, 2, 4, 0]
                      totalRunsScored: 14
                      betAmount: 10
                      lossAmount: 10
                      userProfitLoss: -5
                      gamingWalletBalance: 490
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBetType:
                  value:
                    success: false
                    message: Bet type must be OVER or UNDER
                    data: null
                invalidRunThreshold:
                  value:
                    success: false
                    message: 'Run threshold must be one of: 6, 8, 10, 12, 14, 16'
                    data: null
                invalidBetAmount:
                  value:
                    success: false
                    message: Bet amount must be a positive integer
                    data: null
                betAmountOutOfRange:
                  value:
                    success: false
                    message: Bet amount must be between 10 and 500
                    data: null
                insufficientBalance:
                  value:
                    success: false
                    message: Insufficient balance in gaming wallet
                    data: null
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Authentication required
                data: null
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

