paths:
  /api/v1/roi/summary:
    get:
      tags:
        - ROI
      summary: Get ROI summary
      description: Get comprehensive ROI summary including total investments, total earnings, current balance, locked/unlocked balance, and ROI rates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ROI summary fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: ROI summary fetched successfully
                  data:
                    type: object
                    properties:
                      totalInvestments:
                        type: number
                        description: Total number of active ROI investments
                        example: 5
                      totalPrincipal:
                        type: number
                        description: Total principal amount invested
                        example: 1000.50
                      totalRoiEarned:
                        type: number
                        description: Total ROI earned so far
                        example: 25.75
                      currentBalance:
                        type: number
                        description: Current total balance (principal + ROI)
                        example: 1026.25
                      lockedBalance:
                        type: number
                        description: Balance still in lock-in period
                        example: 500.00
                      unlockedBalance:
                        type: number
                        description: Balance available for withdrawal
                        example: 526.25
                      monthlyRoiRate:
                        type: number
                        description: Monthly ROI rate in percentage
                        example: 8
                      dailyRoiRate:
                        type: number
                        description: Daily ROI rate in percentage
                        example: 0.257
                      lockInPeriodDays:
                        type: number
                        description: Lock-in period in days
                        example: 7
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/roi/investments:
    get:
      tags:
        - ROI
      summary: Get ROI investments
      description: Get list of all ROI investments for the authenticated user with pagination
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page
      responses:
        '200':
          description: ROI investments fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: ROI investments fetched successfully
                  data:
                    type: object
                    properties:
                      investments:
                        type: array
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: 507f1f77bcf86cd799439011
                            userId:
                              type: string
                              example: 507f1f77bcf86cd799439012
                            depositTransactionId:
                              type: object
                              properties:
                                transactionId:
                                  type: string
                                  example: TXN20251228143025001
                                amount:
                                  type: number
                                  example: 100.50
                                currency:
                                  type: string
                                  example: USDT
                                createdAt:
                                  type: string
                                  format: date-time
                            principalAmount:
                              type: number
                              example: 100.50
                            currentBalance:
                              type: number
                              example: 102.75
                            lockInPeriod:
                              type: number
                              example: 7
                            lockInStartDate:
                              type: string
                              format: date-time
                            lockInEndDate:
                              type: string
                              format: date-time
                            isLocked:
                              type: boolean
                              example: true
                            daysRemaining:
                              type: number
                              description: Days remaining in lock-in period (0 if unlocked)
                              example: 3
                            lastRoiCalculationDate:
                              type: string
                              format: date-time
                            totalRoiEarned:
                              type: number
                              example: 2.25
                            isActive:
                              type: boolean
                              example: true
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
                      totalCount:
                        type: number
                        example: 5
                      currentPage:
                        type: number
                        example: 1
                      totalPages:
                        type: number
                        example: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/roi/earnings-history:
    get:
      tags:
        - ROI
      summary: Get ROI earnings history
      description: Get history of ROI earnings/credits with optional date range filter
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: Start date for filtering (ISO 8601 format)
          example: '2024-01-01T00:00:00Z'
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: End date for filtering (ISO 8601 format)
          example: '2024-12-31T23:59:59Z'
      responses:
        '200':
          description: ROI earnings history fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: ROI earnings history fetched successfully
                  data:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transaction'
                      totalCount:
                        type: number
                        example: 30
                      currentPage:
                        type: number
                        example: 1
                      totalPages:
                        type: number
                        example: 2
                      totalEarnings:
                        type: number
                        description: Total ROI earnings in the filtered period
                        example: 125.50
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    RoiInvestment:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        depositTransactionId:
          type: string
        principalAmount:
          type: number
        currentBalance:
          type: number
        lockInPeriod:
          type: number
        lockInStartDate:
          type: string
          format: date-time
        lockInEndDate:
          type: string
          format: date-time
        isLocked:
          type: boolean
        lastRoiCalculationDate:
          type: string
          format: date-time
        totalRoiEarned:
          type: number
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
