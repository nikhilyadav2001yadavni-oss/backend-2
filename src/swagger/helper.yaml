paths:
  /api/v1/helper/upload-image:
    post:
      tags:
        - Helper
      summary: Upload image to Cloudinary
      description: |
        Upload an image file to Cloudinary and get the URL.
        Requires authentication.
        Maximum file size: 5MB
        Supported formats: image/* (jpg, png, gif, webp, etc.)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Image file to upload
                folder:
                  type: string
                  example: currency
                  description: 'Cloudinary folder path (optional, default: general)'
                publicId:
                  type: string
                  example: trx-icon
                  description: Public ID for the image (optional)
      responses:
        '200':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Image uploaded successfully
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        example: http://res.cloudinary.com/example/image/upload/v1234567890/currency/trx-icon.png
                        description: Image URL
                      secure_url:
                        type: string
                        example: https://res.cloudinary.com/example/image/upload/v1234567890/currency/trx-icon.png
                        description: Secure HTTPS image URL
                      public_id:
                        type: string
                        example: currency/trx-icon
                        description: Public ID for the image (used for deletion)
              examples:
                success:
                  value:
                    success: true
                    message: Image uploaded successfully
                    data:
                      url: http://res.cloudinary.com/example/image/upload/v1234567890/currency/trx-icon.png
                      secure_url: https://res.cloudinary.com/example/image/upload/v1234567890/currency/trx-icon.png
                      public_id: currency/trx-icon
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noFile:
                  value:
                    success: false
                    message: No image file provided
                    data: null
                invalidFile:
                  value:
                    success: false
                    message: Only image files are allowed
                    data: null
                fileTooLarge:
                  value:
                    success: false
                    message: File size exceeds 5MB limit
                    data: null
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cloudinaryError:
                  value:
                    success: false
                    message: 'Cloudinary upload failed: Invalid API credentials'
                    data: null
