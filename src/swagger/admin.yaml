paths:
  /api/v1/admin/signup:
    post:
      tags:
        - Admin
      summary: Register a new admin
      description: Create a new admin account with email, username, and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Admin User
                  description: Admin name
                email:
                  type: string
                  format: email
                  example: admin@winvest.com
                  description: Admin email address
                password:
                  type: string
                  format: password
                  example: AdminSecure123!
                  description: Admin password (strong password required)
      responses:
        '200':
          description: Admin registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Admin Created Successfully
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: 60d5ec49f8d2e63a4c8e9a1a
                      name:
                        type: string
                        example: Admin User
                      email:
                        type: string
                        example: admin@winvest.com
                      role:
                        type: string
                        example: admin
                      token:
                        type: object
                        properties:
                          accessToken:
                            type: string
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                          refreshToken:
                            type: string
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                          accessTokenExpiry:
                            type: string
                            format: date-time
                          refreshTokenExpiry:
                            type: string
                            format: date-time
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                adminExists:
                  value:
                    success: false
                    message: Admin already exists with this email
                    data: null
                weakPassword:
                  value:
                    success: false
                    message: Password must be at least 8 characters long
                    data: null

  /api/v1/admin/dashboard-stats:
    get:
      tags:
        - Admin
      summary: Get admin dashboard statistics
      description: Fetch comprehensive dashboard statistics including users, deposits, withdrawals, games played, revenue, and pending transactions. Requires admin authentication.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dashboard statistics fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Dashboard statistics fetched successfully
                  data:
                    type: object
                    properties:
                      totalUsers:
                        type: object
                        properties:
                          count:
                            type: number
                            example: 1234
                          percentageChange:
                            type: number
                            example: 12.5
                            description: Percentage change vs last month
                          trend:
                            type: string
                            enum: [up, down]
                            example: up
                      activeUsers:
                        type: object
                        properties:
                          count:
                            type: number
                            example: 856
                          percentageChange:
                            type: number
                            example: 8.2
                          trend:
                            type: string
                            enum: [up, down]
                            example: up
                      totalDeposits:
                        type: object
                        properties:
                          amount:
                            type: number
                            example: 1250000
                            description: Total deposits in current month
                          percentageChange:
                            type: number
                            example: 15.3
                          trend:
                            type: string
                            enum: [up, down]
                            example: up
                      totalWithdrawals:
                        type: object
                        properties:
                          amount:
                            type: number
                            example: 850000
                            description: Total withdrawals in current month
                          percentageChange:
                            type: number
                            example: -5.1
                          trend:
                            type: string
                            enum: [up, down]
                            example: down
                      gamesPlayed:
                        type: object
                        properties:
                          count:
                            type: number
                            example: 5678
                          percentageChange:
                            type: number
                            example: 22.8
                          trend:
                            type: string
                            enum: [up, down]
                            example: up
                      platformRevenue:
                        type: object
                        properties:
                          amount:
                            type: number
                            example: 125000
                            description: Platform revenue (Deposits - Withdrawals - Game Wins)
                          percentageChange:
                            type: number
                            example: 18.7
                          trend:
                            type: string
                            enum: [up, down]
                            example: up
                      pendingWithdrawals:
                        type: object
                        properties:
                          count:
                            type: number
                            example: 15
                      pendingDeposits:
                        type: object
                        properties:
                          count:
                            type: number
                            example: 8
        '401':
          description: Unauthorized - Invalid or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/signin:
    post:
      tags:
        - Admin
      summary: Admin login
      description: Authenticate admin with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@winvest.com
                  description: Admin email address
                password:
                  type: string
                  format: password
                  example: AdminSecure123!
                  description: Admin password
      responses:
        '200':
          description: Admin login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Admin Signed In
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: 60d5ec49f8d2e63a4c8e9a1a
                      name:
                        type: string
                        example: Admin User
                      email:
                        type: string
                        example: admin@winvest.com
                      role:
                        type: string
                        example: admin
                      token:
                        type: object
                        properties:
                          accessToken:
                            type: string
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                          refreshToken:
                            type: string
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                          accessTokenExpiry:
                            type: string
                            format: date-time
                          refreshTokenExpiry:
                            type: string
                            format: date-time
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '401':
          description: Unauthorized - invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid email or password
                  data:
                    type: null
                    example: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/recent-transactions:
    get:
      tags:
        - Admin
      summary: Get recent transactions
      description: Fetch recent transactions for admin dashboard with user details, type, amount, and status
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Number of transactions to fetch (default 10)
      responses:
        '200':
          description: Recent transactions fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Recent transactions fetched successfully
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user:
                          type: string
                          example: John Doe
                        email:
                          type: string
                          example: john@example.com
                        type:
                          type: string
                          enum: [deposit, withdrawal, game_win, game_lose, roi_credit, referral_bonus]
                          example: deposit
                        amount:
                          type: number
                          example: 5000
                        currency:
                          type: string
                          example: USDT
                        status:
                          type: string
                          enum: [completed, pending, failed]
                          example: completed
                        transactionId:
                          type: string
                          example: TX20260118123456
                        date:
                          type: string
                          format: date-time
                          example: '2026-01-18T10:30:00.000Z'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/recent-games:
    get:
      tags:
        - Admin
      summary: Get recent games
      description: Fetch recent games for admin dashboard with user details, game type, bet amount, and result
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Number of games to fetch (default 10)
      responses:
        '200':
          description: Recent games fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Recent games fetched successfully
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user:
                          type: string
                          example: John Doe
                        email:
                          type: string
                          example: john@example.com
                        game:
                          type: string
                          enum: [Color, Dice]
                          example: Color
                        bet:
                          type: number
                          example: 100
                        currency:
                          type: string
                          example: USDT
                        result:
                          type: string
                          enum: [win, lose]
                          example: win
                        winAmount:
                          type: number
                          example: 100
                        gameId:
                          type: string
                          example: GAME20260118123456
                        date:
                          type: string
                          format: date-time
                          example: '2026-01-18T10:30:00.000Z'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/game-configs:
    get:
      tags:
        - Admin
      summary: Get game configurations
      description: |
        Fetch game configurations. Requires authentication.
        - Get all game configs: Call without query parameters
        - Get specific game config: Use ?gameType=COLOR_CHANGER or ?gameType=DICE_ROLL
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: gameType
          schema:
            type: string
            enum: [COLOR_CHANGER, DICE_ROLL]
          required: false
          description: Filter by specific game type (optional)
          example: COLOR_CHANGER
      responses:
        '200':
          description: Game configurations fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Game configurations fetched successfully
                  data:
                    oneOf:
                      - type: object
                        description: Object with configs array and metrics (when gameType not specified)
                        properties:
                          configs:
                            type: array
                            items:
                              $ref: '#/components/schemas/GameConfig'
                          metrics:
                            type: object
                            properties:
                              activeConfigs:
                                type: number
                                example: 2
                                description: Number of active game configurations
                              totalPlayers:
                                type: number
                                example: 2100
                                description: Total number of players/users
                              totalPlayersFormatted:
                                type: string
                                example: '2.1K+'
                                description: Formatted player count (e.g., "2.1K+" for 2100+ players)
                      - type: object
                        description: Single game config with metrics (when gameType specified)
                        allOf:
                          - $ref: '#/components/schemas/GameConfig'
                          - type: object
                            properties:
                              metrics:
                                type: object
                                properties:
                                  activeConfigs:
                                    type: number
                                    example: 2
                                  totalPlayers:
                                    type: number
                                    example: 2100
                                  totalPlayersFormatted:
                                    type: string
                                    example: '2.1K+'
                    description: Game configuration(s) with metrics
              examples:
                allConfigs:
                  value:
                    success: true
                    message: 'Game configurations fetched successfully'
                    data:
                      configs:
                        - _id: 60d5ec49f8d2e63a4c8e9a1a
                          gameType: COLOR_CHANGER
                          gameName: Color Changer
                          maxUserProfit: 25
                          maxUserLoss: 25
                          winProbability: 0.4
                          winMultiplier: 2
                          platformBalanceBuffer: 1.1
                          maxSmallWinAmount: 5
                          minBetAmount: 1
                          maxBetAmount: 25
                          isActive: true
                          metadata:
                            description: 'Select a color (RED, GREEN, or BLUE) and place your bet. Win 2x your bet amount!'
                            rules:
                              - 'Select one of three colors: RED, GREEN, or BLUE'
                              - 'Bet amount must be between 1 and 25'
                              - 'Win multiplier: 2x your bet amount'
                              - 'Maximum profit: $25'
                              - 'Maximum loss: $25'
                          createdAt: '2024-01-01T00:00:00.000Z'
                          updatedAt: '2024-01-01T00:00:00.000Z'
                        - _id: 60d5ec49f8d2e63a4c8e9a1b
                          gameType: DICE_ROLL
                          gameName: Dice Roll
                          maxUserProfit: 25
                          maxUserLoss: 25
                          winProbability: 0.4
                          winMultiplier: 2
                          platformBalanceBuffer: 1.1
                          maxSmallWinAmount: 5
                          minBetAmount: 1
                          maxBetAmount: 25
                          isActive: true
                          metadata:
                            description: 'Roll the dice and predict the outcome. Win 2x your bet amount!'
                          createdAt: '2024-01-01T00:00:00.000Z'
                          updatedAt: '2024-01-01T00:00:00.000Z'
                      metrics:
                        activeConfigs: 2
                        totalPlayers: 2100
                        totalPlayersFormatted: '2.1K+'
                singleConfig:
                  value:
                    success: true
                    message: 'Game configuration fetched successfully'
                    data:
                      _id: 60d5ec49f8d2e63a4c8e9a1a
                      gameType: COLOR_CHANGER
                      gameName: Color Changer
                      maxUserProfit: 25
                      maxUserLoss: 25
                      winProbability: 0.4
                      winMultiplier: 2
                      platformBalanceBuffer: 1.1
                      maxSmallWinAmount: 5
                      minBetAmount: 1
                      maxBetAmount: 25
                      isActive: true
                      metadata:
                        description: 'Select a color (RED, GREEN, or BLUE) and place your bet. Win 2x your bet amount!'
                        rules:
                          - 'Select one of three colors: RED, GREEN, or BLUE'
                          - 'Bet amount must be between 1 and 25'
                      createdAt: '2024-01-01T00:00:00.000Z'
                      updatedAt: '2024-01-01T00:00:00.000Z'
                      metrics:
                        activeConfigs: 2
                        totalPlayers: 2100
                        totalPlayersFormatted: '2.1K+'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  value:
                    success: false
                    message: Authentication token is required
                    data: null
        '404':
          description: Game configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    success: false
                    message: Game configuration not found for COLOR_CHANGER
                    data: null
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/currency:
    post:
      tags:
        - Admin
      summary: Add a new currency
      description: |
        Create a new currency with symbol, name, chain, color code, and image.
        Requires authentication.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - symbol
                - name
                - chain
                - depositAddress
              properties:
                symbol:
                  type: string
                  enum: [TRX, BNB, ETH, SOL]
                  example: TRX
                  description: Currency symbol (must be unique)
                name:
                  type: string
                  example: Tron
                  description: Currency name
                chain:
                  type: string
                  enum: [TRC20, BEP20, ERC20, POLYGON]
                  example: TRC20
                  description: Blockchain chain
                colorCode:
                  type: string
                  example: '#FF0000'
                  description: Hex color code for UI (e.g., #FF0000 or #F00)
                image:
                  type: string
                  example: https://res.cloudinary.com/example/image/upload/v1234567890/currency/trx.png
                  description: URL to currency image/icon (upload via /api/v1/helper/upload-image first)
                depositAddress:
                  type: string
                  example: TXYZabcdefghijklmnopqrstuvwxyz123456
                  description: Wallet address for receiving deposits (required)
                minimumDepositAmount:
                  type: number
                  example: 10
                  default: 0
                  description: Minimum deposit amount
                minimumWithdrawalAmount:
                  type: number
                  example: 20
                  default: 0
                  description: Minimum withdrawal amount
                depositFee:
                  type: number
                  example: 2
                  default: 0
                  description: Deposit fee
                depositFeeType:
                  type: string
                  enum: [percentage, fixed]
                  example: percentage
                  default: percentage
                  description: Deposit fee type
                withdrawalFee:
                  type: number
                  example: 1
                  default: 0
                  description: Withdrawal fee
                withdrawalFeeType:
                  type: string
                  enum: [percentage, fixed]
                  example: fixed
                  default: percentage
                  description: Withdrawal fee type
                isActive:
                  type: boolean
                  example: true
                  default: true
                  description: Whether the currency is active
      responses:
        '201':
          description: Currency added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Currency added successfully
                  data:
                    $ref: '#/components/schemas/Currency'
              examples:
                success:
                  value:
                    success: true
                    message: Currency added successfully
                    data:
                      _id: 60d5ec49f8d2e63a4c8e9a1a
                      symbol: TRX
                      name: Tron
                      chain: TRC20
                      colorCode: '#FF0000'
                      image: https://res.cloudinary.com/example/image/upload/v1234567890/currency/trx.png
                      depositAddress: TXYZabcdefghijklmnopqrstuvwxyz123456
                      minimumDepositAmount: 10
                      minimumWithdrawalAmount: 20
                      depositFee: 2
                      depositFeeType: percentage
                      withdrawalFee: 1
                      withdrawalFeeType: fixed
                      isActive: true
                      createdAt: '2024-01-01T00:00:00.000Z'
                      updatedAt: '2024-01-01T00:00:00.000Z'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingFields:
                  value:
                    success: false
                    message: 'Symbol, name, chain, and depositAddress are required fields'
                    data: null
                invalidSymbol:
                  value:
                    success: false
                    message: 'Symbol must be one of: TRX, BNB, ETH, SOL'
                    data: null
                invalidColorCode:
                  value:
                    success: false
                    message: Color code must be a valid hex color (e.g., #FF0000 or #F00)
                    data: null
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - currency already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                conflict:
                  value:
                    success: false
                    message: Currency with symbol TRX already exists
                    data: null
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/system-config:
    get:
      tags:
        - Admin
      summary: Get system configuration
      description: |
        Retrieve the current system configuration settings including:
        - Dark Mode (enable/disable)
        - Push Notification (enable/disable)
        - 2FA (enable/disable)
        - Biometric Login (enable/disable)
        - Maintenance Mode (enable/disable)
        - Maintenance Message (optional)
        Requires authentication.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System configuration fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: System configuration fetched successfully
                  data:
                    $ref: '#/components/schemas/SystemConfig'
              examples:
                success:
                  value:
                    success: true
                    message: System configuration fetched successfully
                    data:
                      _id: 60d5ec49f8d2e63a4c8e9a1a
                      darkMode: false
                      pushNotification: true
                      twoFA: false
                      biometricLogin: false
                      maintenance: false
                      maintenanceMessage: null
                      supportEmail: 'support@winvest.com'
                      createdAt: '2024-01-01T00:00:00.000Z'
                      updatedAt: '2024-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Admin
      summary: Update system configuration
      description: |
        Update system configuration settings. All fields are optional - only provided fields will be updated.
        Requires authentication.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                darkMode:
                  type: boolean
                  example: true
                  description: Enable/disable dark mode
                pushNotification:
                  type: boolean
                  example: true
                  description: Enable/disable push notifications
                twoFA:
                  type: boolean
                  example: true
                  description: Enable/disable two-factor authentication
                biometricLogin:
                  type: boolean
                  example: false
                  description: Enable/disable biometric login
                maintenance:
                  type: boolean
                  example: false
                  description: Enable/disable maintenance mode
                maintenanceMessage:
                  type: string
                  nullable: true
                  example: 'System is under maintenance. Please check back later.'
                  description: Optional maintenance message (shown when maintenance mode is enabled)
                supportEmail:
                  type: string
                  example: 'support@winvest.com'
                  description: Support contact email address
      responses:
        '200':
          description: System configuration updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: System configuration updated successfully
                  data:
                    $ref: '#/components/schemas/SystemConfig'
              examples:
                updateAll:
                  value:
                    success: true
                    message: System configuration updated successfully
                    data:
                      _id: 60d5ec49f8d2e63a4c8e9a1a
                      darkMode: true
                      pushNotification: true
                      twoFA: true
                      biometricLogin: true
                      maintenance: false
                      maintenanceMessage: null
                      supportEmail: 'support@winvest.com'
                      createdAt: '2024-01-01T00:00:00.000Z'
                      updatedAt: '2024-01-01T12:00:00.000Z'
                updateSingle:
                  value:
                    success: true
                    message: System configuration updated successfully
                    data:
                      _id: 60d5ec49f8d2e63a4c8e9a1a
                      darkMode: true
                      pushNotification: true
                      twoFA: false
                      biometricLogin: false
                      maintenance: false
                      maintenanceMessage: null
                      supportEmail: 'support@winvest.com'
                      createdAt: '2024-01-01T00:00:00.000Z'
                      updatedAt: '2024-01-01T12:00:00.000Z'
                maintenanceMode:
                  value:
                    success: true
                    message: System configuration updated successfully
                    data:
                      _id: 60d5ec49f8d2e63a4c8e9a1a
                      darkMode: false
                      pushNotification: true
                      twoFA: false
                      biometricLogin: false
                      maintenance: true
