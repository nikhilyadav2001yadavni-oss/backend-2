  /api/v1/admin/test-deposit:
    post:
      tags:
        - Admin
      summary: Create test deposit (No blockchain verification)
      description: |
        Create a test deposit for a user without blockchain verification. This endpoint is for testing purposes only.
        
        **Flow:**
        1. Validates currency and minimum deposit amount
        2. Calculates and deducts deposit fee
        3. Splits net amount 50-50 between gamingWallet and roiWallet
        4. Creates ROI investment with 7-day lock-in period
        5. Processes referral bonuses (Direct: 3%, Indirect: 1.5%)
        6. Credits amounts to respective wallets
        
        **Note:** This endpoint bypasses blockchain verification and should only be used in development/testing environments.
        Requires admin authentication.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currency
                - amount
              properties:
                currency:
                  type: string
                  enum: [TRX, BNB, ETH, SOL]
                  example: TRX
                  description: Currency symbol
                amount:
                  type: number
                  minimum: 0.00000001
                  example: 100
                  description: Deposit amount
      responses:
        '200':
          description: Test deposit successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'TEST Deposit successful! 49.5 TRX credited to Gaming Wallet and 49.5 TRX credited to ROI Wallet (Fee: 1 TRX). Note: This is a test deposit without blockchain verification.'
                  data:
                    $ref: '#/components/schemas/Transaction'
              examples:
                success:
                  value:
                    success: true
                    message: 'TEST Deposit successful! 49.5 TRX credited to Gaming Wallet and 49.5 TRX credited to ROI Wallet (Fee: 1 TRX). Note: This is a test deposit without blockchain verification.'
                    data:
                      _id: 60d5ec49f8d2e63a4c8e9a1b
                      transactionId: TXN20241228143025457
                      userId: 60d5ec49f8d2e63a4c8e9a1a
                      category: DEPOSIT
                      status: COMPLETED
                      amount: 100
                      currency: TRX
                      network: TRC20
                      fee: 1
                      netAmount: 99
                      fromAddress: TEST_ADDRESS
                      toAddress: TXYZabcdefghijklmnopqrstuvwxyz123456
                      transactionHash: TEST_1703773825000_abc123
                      blockchainVerified: false
                      metadata:
                        gamingWalletAmount: 49.5
                        roiWalletAmount: 49.5
                        notes: 'TEST DEPOSIT - Processed successfully without blockchain verification'
                      createdAt: '2024-12-28T14:30:25.000Z'
                      updatedAt: '2024-12-28T14:30:25.000Z'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingFields:
                  value:
                    success: false
                    message: 'Missing required fields: currency, amount'
                    data: null
                minimumAmount:
                  value:
                    success: false
                    message: 'Minimum deposit amount for TRX is 10'
                    data: null
                invalidAmount:
                  value:
                    success: false
                    message: 'Amount must be greater than 0'
                    data: null
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

