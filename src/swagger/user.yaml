  /api/v1/user/update-fcm-token:
    post:
      tags:
        - User
        - Firebase
      summary: Update FCM token for push notifications
      description: |
        Register or update Firebase Cloud Messaging (FCM) token for receiving push notifications.
        
        **When to call this API:**
        - After user login
        - When FCM token is refreshed (Firebase SDK handles this automatically)
        - When app starts and user is already logged in
        - After app reinstall
        
        **How it works:**
        1. Frontend obtains FCM token from Firebase SDK
        2. Frontend sends token to this endpoint
        3. Backend stores token in user's profile
        4. Backend uses stored token to send push notifications
        
        **Firebase Integration:**
        - Backend uses Firebase Admin SDK
        - Service account: `winvest-edf4a-firebase-adminsdk-fbsvc-b921e07078.json`
        - Project ID: `winvest-edf4a`
        - Supports both Android and iOS push notifications
        
        **Token Management:**
        - Invalid tokens are automatically removed from database
        - Token refresh is handled automatically by Firebase SDK
        - Each user can have one active FCM token
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FCMToken'
            examples:
              validToken:
                value:
                  fcmToken: dKx8Yz9vWqR:APA91bH...your-fcm-token-here
                description: Valid FCM token from Firebase SDK
      responses:
        '200':
          description: FCM token updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: FCM token updated successfully
                  data:
                    type: null
                    example: null
              examples:
                success:
                  value:
                    success: true
                    message: FCM token updated successfully
                    data: null
        '400':
          description: Bad request - Invalid or missing FCM token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingToken:
                  value:
                    success: false
                    message: FCM token is required and must be a string
                    data: null
                invalidToken:
                  value:
                    success: false
                    message: FCM token is required and must be a string
                    data: null
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  value:
                    success: false
                    message: Authentication required
                    data: null

  /api/v1/user/logout:
    post:
      tags:
        - User
        - Firebase
      summary: User logout
      description: |
        Logout the authenticated user and clear their FCM token. This ensures that push notifications are not sent to the user's device after logout.
        
        **What happens:**
        - User's FCM token is removed from the database
        - User will no longer receive push notifications
        - User must re-register FCM token after next login to receive notifications again
        
        **Security:**
        - Requires valid authentication token
        - Only the authenticated user can logout themselves
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful - FCM token cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logged out successfully. FCM token cleared.
                  data:
                    type: null
                    example: null
              examples:
                success:
                  value:
                    success: true
                    message: Logged out successfully. FCM token cleared.
                    data: null
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  value:
                    success: false
                    message: Authentication required
                    data: null
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                serverError:
                  value:
                    success: false
                    message: Failed to logout
                    data: null

